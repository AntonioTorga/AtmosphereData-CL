[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AtmosphereData-CL"
version = "0.1.0"
description = "Download atmospheric data products (observation networks, model output, satellite) and reshape them between formats and layouts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{ name = "Antonio Andrés Torga Mellado", email = "antonio.torga@ug.uchile.cl" }]
dependencies = [
        "typer>=0.12",
        "dask",
        "xarray",
        "pyarrow",
        "httpx",
        "netcdf4",
        "pandas",
        "numpy",
        "python-dateutil",
        "typing_extensions",
        "rich",
        "beautifulsoup4",
        "lxml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
AtmosphereData-CL = "atmosphere_data_cl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atmosphere_data_cl = ["config/*.json"]

[tool.black]
line-length = 88